services:
  postgres:
    image: postgres:16-alpine
    container_name: college-discovery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_discovery
    ports:
      - '5432:5432'
    volumes:
      - college_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d college_discovery']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  college_pgdata:
